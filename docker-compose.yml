# Nanda 共病专病科研平台 — Docker 一键部署
# 用法: docker compose up -d --build

services:
  mysql:
    image: mysql:8.0
    container_name: nanda-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nanda}
      MYSQL_USER: ${MYSQL_USER:-nanda}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nanda123}
    volumes:
      - nanda_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - nanda-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nanda-server
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE:-nanda}
      DB_USER: ${MYSQL_USER:-nanda}
      DB_PASS: ${MYSQL_PASSWORD:-nanda123}
      JWT_SECRET: ${JWT_SECRET:-nanda-docker-secret-change-me-min-32-chars!!}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - nanda-net

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nanda-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - nanda-net

volumes:
  nanda_mysql_data:

networks:
  nanda-net:
    driver: bridge
