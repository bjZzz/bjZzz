spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:3306/${DB_NAME:nanda}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:nanda}
    password: ${DB_PASS:nanda123}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.nanda: INFO
    org.springframework.security: WARN

server:
  port: 8080

nanda:
  jwt:
    secret: ${JWT_SECRET:nanda-docker-secret-change-me-min-32-chars!!}
  mq:
    enabled: false
  redis:
    enabled: false
  elasticsearch:
    enabled: false
  sandbox:
    enabled: false
